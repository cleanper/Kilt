name: Gradle CI

on:
  push:
    branches:
      - 'version/*'
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read
  packages: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build:
    environment: Kilt Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - run: chmod +x ./gradlew

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew remapJar build --parallel --no-daemon --stacktrace

      - name: Archive logs
        run: |
          mkdir -p logs
          cp build/reports/tests/test/* logs/ || true
          cp build/outputs/logs/* logs/ || true
          zip -r build/logs.zip logs/

      - name: Archive source
        run: zip -r build/source.zip . -x '*.git*' 'build/*' '.gradle/*'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kilt-Build-${{ github.run_number }}
          path: |
            build/libs/Kilt-*.jar
            build/source.zip
            build/logs.zip
          retention-days: 0

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_COUNTER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: Kilt-Build-${{ github.run_number }}
          path: artifacts

      - name: Prepare release assets
        id: prepare_assets
        run: |
          JAR_PATH=$(find artifacts -name 'Kilt-*.jar' -not -name '*-sources*' | head -n 1)
          JAR_FILE=$(basename "$JAR_PATH")
          BASE_NAME=$(basename "$JAR_FILE" .jar)
          NEW_JAR_NAME="${BASE_NAME}+build.${BUILD_COUNTER}.jar"
          mkdir -p release
          cp "$JAR_PATH" "release/$NEW_JAR_NAME"
          cp artifacts/source.zip release/
          cp artifacts/logs.zip release/
          echo "version=${BASE_NAME}+build.${BUILD_COUNTER}" >> $GITHUB_OUTPUT
          echo "jar_file=release/$NEW_JAR_NAME" >> $GITHUB_OUTPUT

      - name: Get version description
        id: version_desc
        run: |
          CURRENT_VERSION="${{ steps.prepare_assets.outputs.version }}"
          VERSION_LINE=$(grep -n "^${CURRENT_VERSION}" Version_Description.txt | cut -d: -f1)
          DESCRIPTION=$(awk -v line="$VERSION_LINE" 'NR==line+1' Version_Description.txt)
          echo "description=${DESCRIPTION:-No description available}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: previous_tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match "v*" "$(git rev-list --tags --skip=1 --max-count=1)" 2>/dev/null || echo "")
          echo "previous_tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prepare_assets.outputs.version }}
          name: ${{ steps.prepare_assets.outputs.version }}
          body: |
            ${{ steps.version_desc.outputs.description }}
            Full Changelog: https://github.com/${{ github.repository }}/compare/${{ steps.previous_tag.outputs.previous_tag }}...v${{ steps.prepare_assets.outputs.version }}
          files: |
            ${{ steps.prepare_assets.outputs.jar_file }}
            release/source.zip
            release/logs.zip
          draft: false
          prerelease: false
          generate_release_notes: false
